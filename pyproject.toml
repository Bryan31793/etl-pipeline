[project]
name = "etl-pipeline"
version = "0.1.0"
description = "An ETL pipeline architecture implementation"
authors = [
    {name = "Bryan31793",email = "bryanrmzlop@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
